name: paper-bot
# One long-running loop: bot.js every ~60s for ~5h40m, then the run re-dispatches itself.
# Cron every 15 min is only a backup that starts a loop if none is running.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      chain:
        description: 'continuation of a previous loop (skip the guard)'
        required: false
        default: 'false'
      minutes:
        description: 'loop length in minutes (max ~345)'
        required: false
        default: '340'
permissions:
  contents: write
  actions: write
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.chk.outputs.skip }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.chain }}" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/paper.yml/runs?per_page=20" --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status==\"in_progress\" or .status==\"queued\" or .status==\"waiting\" or .status==\"pending\")] | length")
          echo "other active runs: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
  loop:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: paper-bot-loop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: checkout data branch
        run: |
          git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
          git worktree add -B data data origin/data
          cd data && git config user.name "paper-bot" && git config user.email "paper-bot@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: loop (virtual money, public market data only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M="${{ inputs.minutes }}"; [ -z "$M" ] && M=340
          END=$(( $(date +%s) + M*60 ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            t0=$(date +%s); i=$((i+1))
            timeout 150 node bot.js data/state.json || echo "bot iteration $i failed"
            if [ -f data/state.json ]; then
              ( cd data && git add state.json && \
                if git rev-parse -q --verify HEAD >/dev/null; then git commit -q --amend -m "state $(date -u +%FT%TZ)"; else git commit -q -m "state"; fi && \
                git push -q -f origin HEAD:data ) || echo "push failed ($i)"
            fi
            # refresh the same-origin copy on the site every ~3 min (cheap artifact deploy)
            [ $((i % 3)) -eq 1 ] && (gh workflow run pages.yml --ref main >/dev/null 2>&1 || echo "pages dispatch failed")
            dt=$(( $(date +%s) - t0 )); [ $dt -lt 60 ] && sleep $(( 60 - dt ))
          done
          echo "iterations: $i"
      - name: continue in a new run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for k in 1 2 3; do gh workflow run paper.yml --ref main -f chain=true && break; sleep 10; done
